<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Restaurant Order</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Good Eats Restaurant</h1>
    <p>Call us: <a id="call-link" href="tel:+1234567890">+1 (234) 567-890</a></p>
  </header>

  <main>
    <section id="menu">
      <h2>Menu</h2>
      <div id="menu-list" class="grid"></div>
    </section>

    <aside id="cart">
      <h2>Your Order</h2>
      <div id="cart-items"></div>
      <div class="total">Total: $<span id="total">0.00</span></div>
      <button id="checkout-btn">Checkout</button>
    </aside>

    <section id="checkout-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Checkout</h2>
        <form id="checkout-form">
          <label>
            Full name
            <input type="text" name="name" required />
          </label>
          <label>
            Phone
            <input type="tel" name="phone" required />
          </label>
          <label>
            Address
            <input type="text" name="address" required />
          </label>

          <fieldset>
            <legend>Payment method</legend>
            <label><input type="radio" name="payment" value="card" checked /> Card</label>
            <label><input type="radio" name="payment" value="cash" /> Cash</label>
          </fieldset>

          <div id="card-fields">
            <label>Card number <input type="text" name="cardNumber" placeholder="1234 5678 9012 3456" /></label>
            <label>Expiry <input type="text" name="expiry" placeholder="MM/YY" /></label>
          </div>

          <div class="modal-actions">
            <button type="submit">Place order</button>
            <button type="button" id="cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <section id="order-confirm" class="hidden">
      <h2>Order placed</h2>
      <div id="order-summary"></div>
      <button id="new-order">New order</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
